[package]
name = "edisondb"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
redb = "2"
rpassword = "7"
zeroize = "1"
thiserror = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "edisondb_bench"
harness = false
