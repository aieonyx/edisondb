syntax = "proto3";
package edisondb;

// ── Enums ──────────────────────────────────────────────────────────────────

enum DataTier {
  CRITICAL = 0;
  PERSONAL = 1;
  NOISE    = 2;
}

// ── Core Messages ──────────────────────────────────────────────────────────

message WriteRequest {
  string   owner_id  = 1;
  string   record_id = 2;
  DataTier tier      = 3;
  bytes    payload   = 4;   // plaintext — server encrypts
}

message WriteResponse {
  bool   success = 1;
  string message = 2;
}

message ReadRequest {
  string   owner_id  = 1;
  string   record_id = 2;
  DataTier tier      = 3;
}

message ReadResponse {
  bool   found   = 1;
  bytes  payload = 2;   // plaintext — server decrypted
  string message = 3;
}

message ListRequest {
  string   owner_id = 1;
  DataTier tier     = 2;
}

message ListResponse {
  repeated string record_ids = 1;
}

message DeleteRequest {
  string   owner_id  = 1;
  string   record_id = 2;
  DataTier tier      = 3;
}

message DeleteResponse {
  bool   success = 1;
  string message = 2;
}

message AuditRequest {
  string owner_id  = 1;
  string record_id = 2;
}

message AuditResponse {
  repeated string entries = 1;   // full history, chronological
}

message EmbedRequest {
  string   owner_id  = 1;
  string   record_id = 2;
  DataTier tier      = 3;
  bytes    payload   = 4;
}

message EmbedResponse {
  bool   success = 1;
  string message = 2;
}

message SearchRequest {
  string   owner_id  = 1;
  DataTier tier      = 2;
  bytes    query_vec = 3;   // serialized f32 vector (little-endian)
  uint32   top_k     = 4;
}

message SearchResponse {
  repeated SearchHit hits = 1;
}

message SearchHit {
  string record_id = 1;
  float  score     = 2;
}

// ── Service ────────────────────────────────────────────────────────────────

service EdisonDB {
  rpc Write  (WriteRequest)  returns (WriteResponse);
  rpc Read   (ReadRequest)   returns (ReadResponse);
  rpc List   (ListRequest)   returns (ListResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);
  rpc Audit  (AuditRequest)  returns (AuditResponse);
  rpc Embed  (EmbedRequest)  returns (EmbedResponse);
  rpc Search (SearchRequest) returns (SearchResponse);
}
