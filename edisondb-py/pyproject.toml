[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "edisondb"
version = "0.1.0a2"
description = "The official Python SDK for EdisonDB — sovereign, AI-native, encrypted database"
license = { text = "Apache-2.0" }
authors = [{ name = "Edison Lepiten", email = "aieonyx.eu@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["database", "encryption", "sovereignty", "embedded", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://edisondb.com"
Repository = "https://github.com/aieonyx/edisondb"
